# Decap CMS: edit the site's JSON content and upload media at /admin.
# One-time setup on Netlify is described in README.md ("Editing content without code").
backend:
  name: git-gateway
  branch: main # the branch Netlify deploys from

# Uploads land in /assets; saved paths look like "assets/...", the same format the JSON already uses.
media_folder: "assets/uploads"
public_folder: "assets/uploads"

site_url: /
display_url: /
logo_url: /favicon.svg

collections:
  # ---------------------------------------------------------------- WORK
  - name: work
    label: Work
    files:
      - name: work
        label: Work library & home cover flow
        file: content/work.json
        format: json
        fields:
          - { name: _how_to_add, label: Note, widget: hidden }
          - { name: all_limit, label: "How many samples 'All' shows before 'Show more'", widget: number, value_type: int, min: 1, default: 8 }
          - name: items
            label: Work samples (Work page)
            label_singular: Work sample
            widget: list
            summary: "{{fields.type}} · {{fields.title}}"
            fields:
              - { name: id, label: "ID (unique, no spaces)", widget: string }
              - { name: type, label: Type, widget: select, options: [Reels, Carousels, AI Video, Ads, Websites] }
              - { name: style, label: "Content style (AI Video only)", widget: select, options: [UGC, BGC, EGC, IGC, AGC], required: false, hint: "Which filter button it appears under on the Work page." }
              - { name: title, label: Title, widget: string }
              - { name: client, label: Client, widget: string }
              - { name: stat, label: "Stat (shown in lime)", widget: string, required: false }
              - { name: video, label: "Video (Reels, or a video ad)", widget: file, required: false, media_folder: "/assets/work/reels", public_folder: "assets/work/reels" }
              - { name: ratio, label: "Frame shape (video)", widget: select, options: ["9:16", "16:9", "4:5", "1:1"], required: false, hint: "Leave empty for 9:16. Use 16:9 for landscape videos." }
              - { name: sound, label: "Video has sound", widget: boolean, default: true, required: false }
              - { name: poster, label: "Video poster image", widget: image, required: false, media_folder: "/assets/work/posters", public_folder: "assets/work/posters" }
              - name: slides
                label: "Carousel slides (1080×1350)"
                widget: list
                required: false
                field: { name: slide, label: Slide, widget: image, media_folder: "/assets/work/carousels", public_folder: "assets/work/carousels" }
              - { name: image, label: "Image (Ads / Websites)", widget: image, required: false, media_folder: "/assets/work/images", public_folder: "assets/work/images" }
              - { name: featured, label: "Also show in the home-page cover flow", widget: boolean, default: false, required: false }
          - name: proof_coverflow
            label: Home-page proof cover flow
            label_singular: Cover-flow card
            widget: list
            summary: "{{fields.stat}} {{fields.unit}} · {{fields.tag}}"
            fields:
              - { name: tag, label: Tag, widget: string }
              - { name: client, label: Client, widget: string }
              - { name: cover, label: Cover image, widget: image, required: false, media_folder: "/assets/work/covers", public_folder: "assets/work/covers" }
              - { name: stat, label: "Stat (e.g. 2.4M+)", widget: string }
              - { name: unit, label: "Unit (e.g. views)", widget: string }
              - { name: line, label: Punchy line, widget: string }
          - name: ai_video
            label: AI video content styles (Work page filters)
            widget: object
            fields:
              - { name: note, label: "Note shown under each style's description", widget: string }
              - name: styles
                label: Content styles (filter buttons, in this order)
                label_singular: Style
                widget: list
                summary: "{{fields.code}} · {{fields.name}}"
                fields:
                  - { name: code, label: "Code (e.g. UGC)", widget: string }
                  - { name: name, label: Full name, widget: string }
                  - { name: who, label: Who creates it, widget: string }
                  - { name: example, label: Best example, widget: string }

  # ---------------------------------------------------------------- ABOUT
  - name: about
    label: About
    files:
      - name: about
        label: About page
        file: content/about.json
        format: json
        fields:
          - { name: headline, label: Headline, widget: string }
          - { name: bio, label: Bio, widget: text }
          - { name: hero_photo, label: Hero photo, widget: image, media_folder: "/assets/photos", public_folder: "assets/photos" }
          - name: stats
            label: Stat tiles
            widget: list
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - name: documentary
            label: Documentary chapters
            label_singular: Chapter
            widget: list
            summary: "{{fields.chapter}} · {{fields.title}}"
            fields:
              - { name: chapter, label: "Chapter (e.g. Chapter 01)", widget: string }
              - { name: year, label: Year, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: caption, label: Subtitle in the player, widget: string }
              - { name: text, label: Story text, widget: text }
              - { name: photo, label: Photo, widget: image, media_folder: "/assets/photos", public_folder: "assets/photos" }
              - { name: alt, label: "Photo description (alt text)", widget: string }
          - name: certificates
            label: Certificates
            label_singular: Certificate
            widget: list
            summary: "{{fields.name}} · {{fields.issuer}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: issuer, label: Issuer, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: photo, label: Photo, widget: image, required: false, media_folder: "/assets/photos/certificates", public_folder: "assets/photos/certificates" }
          - name: gallery
            label: Behind the scenes
            label_singular: Photo
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { name: photo, label: Photo, widget: image, required: false, media_folder: "/assets/photos/gallery", public_folder: "assets/photos/gallery" }
              - { name: caption, label: Caption, widget: string }

  # ---------------------------------------------------------------- SITE
  - name: site
    label: Site settings
    files:
      - name: site
        label: Business info, logos, testimonials
        file: content/site.json
        format: json
        fields:
          - { name: show_drafts, label: "Show drafts (unfinished [PLACEHOLDER] content). Turn off when the site goes live.", widget: boolean, default: true }
          - name: intro_video
            label: Home intro video
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: accent, label: Title (lime part), widget: string }
              - { name: text, label: Text, widget: text }
              - { name: video, label: "Video (MP4, 30–60 s)", widget: file, required: false, media_folder: "/assets/intro", public_folder: "assets/intro" }
              - { name: poster, label: "Cover image (optional)", widget: image, required: false, media_folder: "/assets/intro", public_folder: "assets/intro" }
              - { name: length, label: "Length (e.g. 0:45)", widget: string, required: false }
              - { name: ratio, label: Shape, widget: select, options: ["9:16", "16:9", "1:1", "4:5"], default: "9:16" }
          - name: audit
            label: Free profile audit (Home)
            widget: object
            fields:
              - { name: kicker, label: Small label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: accent, label: Title (lime part), widget: string }
              - { name: text, label: Text, widget: text }
              - { name: points, label: Points, widget: list, field: { name: point, label: Point, widget: string } }
              - { name: button, label: Button text, widget: string }
          - name: platform_badges
            label: Platform badges (under testimonials)
            label_singular: Badge
            widget: list
            summary: "{{fields.platform}} · {{fields.badge}}"
            fields:
              - { name: platform, label: "Platform (e.g. OnlineJobs.ph)", widget: string }
              - { name: badge, label: "Badge (e.g. Top Rated)", widget: string }
              - { name: detail, label: "Detail (e.g. 25 jobs completed)", widget: string }
              - { name: url, label: "Link to your profile there (optional)", widget: string, required: false }
          - { name: brand, label: Brand name, widget: string }
          - { name: owner, label: Owner, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: location, label: Location, widget: string }
          - { name: tagline, label: "Tagline (home headline)", widget: string }
          - { name: subline, label: Subline, widget: text }
          - name: cta_primary
            label: Booking button
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: "Booking link (Google Calendar)", widget: string }
          - name: cta_dm
            label: DM button
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: Link, widget: string }
          - name: links
            label: Links
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: string }
              - { name: linkedin, label: LinkedIn, widget: string }
              - { name: email, label: Public email, widget: string }
          - { name: promises, label: Promises, widget: list, field: { name: promise, label: Promise, widget: string } }
          - name: terms
            label: Terms
            widget: object
            fields:
              - { name: reply_time, label: Reply time, widget: string }
              - { name: payment, label: Payment, widget: string }
              - { name: revisions, label: Revisions, widget: string }
              - { name: turnaround, label: Turnaround, widget: string }
          - name: process
            label: How it works (steps)
            widget: list
            summary: "{{fields.step}}"
            fields:
              - { name: step, label: Step, widget: string }
              - { name: text, label: Text, widget: string }
          - name: client_logos
            label: Client logos
            label_singular: Logo
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Client name, widget: string }
              - { name: logo, label: "Logo (SVG or PNG)", widget: image, required: false, media_folder: "/assets/logos", public_folder: "assets/logos" }
          - name: testimonials
            label: Testimonials
            widget: list
            summary: "{{fields.source}} · {{fields.quote}}"
            fields:
              - { name: quote, label: Quote (word for word), widget: text }
              - { name: highlight, label: "Phrase to highlight in lime (copy it exactly from the quote)", widget: string, required: false }
              - { name: name, label: "Client name (optional)", widget: string, required: false }
              - { name: brand, label: "Brand (optional)", widget: string, required: false }
              - { name: source, label: "Label (e.g. Endorsed by client)", widget: string, required: false }
              - { name: platform, label: "Platform name (e.g. Upwork, OnlineJobs.ph)", widget: string, required: false }
              - { name: url, label: "Link to the review or your profile there (https://…)", widget: string, required: false }
              - { name: featured, label: "Featured (shown large, first)", widget: boolean, default: false, required: false }
              - { name: show, label: "Show on the site", widget: boolean, default: true, required: false }
              - { name: video, label: "Video testimonial (MP4, optional)", widget: file, required: false, media_folder: "/assets/testimonials", public_folder: "assets/testimonials" }
              - { name: poster, label: "Video cover image (optional)", widget: image, required: false, media_folder: "/assets/testimonials", public_folder: "assets/testimonials" }
          - { name: form_endpoint, label: "Form endpoint (Formspree / Web3Forms URL)", widget: string }

  # ---------------------------------------------------------------- CASE STUDIES & PRICING
  - name: results
    label: Case studies & pricing
    files:
      - name: case_studies
        label: Case studies
        file: content/case-studies.json
        format: json
        fields:
          - { name: _how_to_add, label: Note, widget: hidden }
          - { name: title, label: Section title, widget: string }
          - { name: intro, label: Section intro, widget: string }
          - name: items
            label: Case studies
            label_singular: Case study
            widget: list
            summary: "{{fields.brand}} · {{fields.headline}}"
            fields:
              - { name: slug, label: "Page address (/work/…, lowercase, no spaces)", widget: string }
              - { name: brand, label: Brand, widget: string }
              - { name: logo, label: "Logo (optional; reused from client logos if the name matches)", widget: image, required: false, media_folder: "/assets/case-studies", public_folder: "assets/case-studies" }
              - { name: platform, label: "Platform (e.g. Facebook page)", widget: string }
              - { name: niche, label: Niche, widget: string }
              - { name: headline, label: "Headline (e.g. Roam Tail: 1.2K → 8K followers in 3 months)", widget: string }
              - { name: summary, label: One-sentence summary, widget: text }
              - { name: period, label: "Period (e.g. Jan – Mar 2026)", widget: string }
              - name: results
                label: Results
                widget: list
                summary: "{{fields.label}}: {{fields.before}} → {{fields.after}}"
                fields:
                  - { name: label, label: "Metric (e.g. Followers)", widget: string }
                  - { name: before, label: Before, widget: string }
                  - { name: after, label: After, widget: string }
              - { name: challenge, label: Where it started, widget: text }
              - { name: approach, label: What I did, widget: list, field: { name: step, label: Step, widget: string } }
              - name: proof
                label: Analytics screenshots
                widget: list
                required: false
                fields:
                  - { name: image, label: Screenshot, widget: image, media_folder: "/assets/case-studies", public_folder: "assets/case-studies" }
                  - { name: caption, label: "Caption (tool · metric · dates)", widget: string }
              - name: before_after
                label: Before & after
                widget: object
                required: false
                fields:
                  - { name: before, label: Before, widget: image, required: false, media_folder: "/assets/case-studies", public_folder: "assets/case-studies" }
                  - { name: after, label: After, widget: image, required: false, media_folder: "/assets/case-studies", public_folder: "assets/case-studies" }
                  - { name: caption, label: Caption, widget: string, required: false }
              - { name: samples, label: Content samples, widget: list, required: false, field: { name: sample, label: Image, widget: image, media_folder: "/assets/case-studies", public_folder: "assets/case-studies" } }
              - name: quote
                label: Client quote
                widget: object
                required: false
                fields:
                  - { name: text, label: Quote, widget: text, required: false }
                  - { name: name, label: Name, widget: string, required: false }
                  - { name: role, label: "Role, Brand", widget: string, required: false }
              - { name: featured, label: "Also show on the Home page proof section", widget: boolean, default: false, required: false }
      - name: pricing
        label: Packages & pricing
        file: content/pricing.json
        format: json
        fields:
          - { name: kicker, label: Small label, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: accent, label: Title (lime part), widget: string }
          - { name: intro, label: Intro, widget: text }
          - { name: note, label: Note under the packages, widget: string }
          - name: packages
            label: Packages
            label_singular: Package
            widget: list
            summary: "{{fields.name}} · from {{fields.price}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: price, label: "Starting price (e.g. ₱8,000)", widget: string }
              - { name: period, label: "Period (e.g. / month)", widget: string }
              - { name: for, label: Who it's for, widget: string }
              - { name: includes, label: What's included, widget: list, field: { name: item, label: Item, widget: string } }
              - { name: featured, label: Highlight this package, widget: boolean, default: false, required: false }
              - { name: badge, label: "Badge on the highlighted package (optional)", widget: string, required: false }
          - { name: custom, label: Line under everything, widget: string }

  # ---------------------------------------------------------------- ASSISTANT
  - name: assistant
    label: AI assistant
    files:
      - name: faq
        label: Assistant answers
        file: content/assistant-faq.json
        format: json
        fields:
          - { name: _note, label: Note, widget: hidden }
          - { name: assistant_name, label: Assistant name, widget: string }
          - { name: greeting, label: Greeting, widget: text }
          - { name: starter_chips, label: Starter quick replies, widget: list, field: { name: chip, label: Chip, widget: string } }
          - name: fallback
            label: When it doesn't know
            widget: object
            fields:
              - { name: answer, label: Answer, widget: text }
              - { name: chips, label: Quick replies, widget: list, field: { name: chip, label: Chip, widget: string } }
          - name: intents
            label: Questions & answers
            label_singular: Question topic
            widget: list
            summary: "{{fields.id}}"
            fields:
              - { name: id, label: "Topic ID (unique)", widget: string }
              - { name: examples, label: Example questions, widget: list, field: { name: example, label: Question, widget: string } }
              - { name: keywords, label: Keywords, widget: list, field: { name: keyword, label: Keyword, widget: string } }
              - { name: answer, label: Answer, widget: text }
              - { name: chips, label: Quick replies, widget: list, required: false, field: { name: chip, label: Chip, widget: string } }
              - { name: action, label: Action, widget: select, required: false, options: [open_booking, go_work, show_lead_form] }
              - { name: faq, label: "Show in the Home FAQ as this question (optional)", widget: string, required: false }
              - { name: faq_order, label: "FAQ order (1 = first)", widget: number, value_type: int, required: false }
